name: Flexible-joint project checks

on:
  push:
    branches: [main]
    paths:
      - "matlab/**"
      - "reports/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - "matlab/**"
      - "reports/**"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and archived Simulink models
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source manifest and model archives
        run: python scripts/validate_project.py
      - name: Run repository integrity tests
        run: python -m unittest discover -s tests -v
